sonar.projectKey=BernardoLykawka_viaja-junto.server
sonar.organization=bernardolykawka

sonar.projectName=ViajaJunto API
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.e2e-spec.ts
sonar.sourceEncoding=UTF-8

# Produced by `npm run test:cov` (vitest + @vitest/coverage-v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluded from analysis for the same reasons they are excluded from coverage
# (see vitest.config.ts): generated output, DI wiring with no branching, and
# adapters that only run against a real database.
sonar.exclusions=\
  dist/**,\
  coverage/**,\
  node_modules/**,\
  prisma/migrations/**,\
  src/**/*.module.ts,\
  src/main.ts

sonar.coverage.exclusions=\
  src/**/*.spec.ts,\
  test/**,\
  src/main.ts,\
  src/**/*.module.ts,\
  src/**/*.entity.ts,\
  src/**/domain/*.repository.ts,\
  src/shared/domain/**,\
  src/**/infrastructure/**,\
  src/shared/database/**,\
  scripts/**
