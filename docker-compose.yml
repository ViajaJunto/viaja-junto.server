name: viajajunto

services:
  # ─────────────────────────── database ────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: viajajunto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-viajajunto}
      # Keeps the volume from being recreated on a locale change.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Postgres accepts connections before it finishes starting up, and that
      # is exactly when `prisma migrate` fails. Everything else waits on this.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-viajajunto}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ────────────────────────── migrations ───────────────────────────
  # One-shot: applies pending migrations and exits.
  #
  # Built from the `build` stage rather than `runtime` on purpose — the
  # runtime image installs with --omit=dev, so it has no Prisma CLI. Keeping
  # the CLI out of the published image keeps it small and reduces the surface
  # Trivy has to scan.
  migrate:
    build:
      context: .
      target: build
    image: viajajunto-migrate:local
    container_name: viajajunto-migrate
    restart: "no"
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-viajajunto}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────── API ────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    # Override to run the published image instead of building locally:
    #   API_IMAGE=<user>/viajajunto-api:latest docker compose up -d --no-build api
    image: ${API_IMAGE:-viajajunto-api:local}
    container_name: viajajunto-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      # `postgres` is the service name on the compose network — not localhost,
      # which inside the container would point at the container itself.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-viajajunto}?schema=public
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      AUTH_REDIRECT_URL: ${AUTH_REDIRECT_URL:-http://localhost:5173/auth/callback}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Uses the liveness route behind the global prefix. Node 22 has fetch
      # built in, so the runtime image needs no curl or wget.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/${API_PREFIX:-api}').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────── dev tooling ────────────────────────────
  # Web client for inspecting the database during development.
  # Off by default — use: docker compose --profile tools up -d
  adminer:
    image: adminer
    container_name: viajajunto-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
