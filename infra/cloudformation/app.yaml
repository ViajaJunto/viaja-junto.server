AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ViajaJunto - API hosting on ECS. The database endpoint comes in as a
  parameter: the RDS instance is created before this stack (see
  infra/deploy.sh for why it is not a resource here).

Parameters:
  Image:
    Type: String
    Description: Full image reference, e.g. localhost:4566/viajajunto-api:latest
  DbHost:
    Type: String
  DbPort:
    Type: String
    Default: '5432'
  DbName:
    Type: String
    Default: viajajunto
  DbUser:
    Type: String
    Default: viajajunto
  DbPassword:
    Type: String
    NoEcho: true
  HostPort:
    Type: Number
    Default: 3001
    Description: Port the API is published on, on the Docker host.
  GoogleClientId:
    Type: String
    NoEcho: true
  GoogleClientSecret:
    Type: String
    NoEcho: true
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  AuthRedirectUrl:
    Type: String
    Default: http://localhost:5173/auth/callback
  PublicStorageUrl:
    Type: String
    Default: http://localhost:4566
    Description: >-
      Base URL browsers use to read objects (path style, bucket appended).
      MiniStack serves S3 on localhost:4566; on real AWS this would be
      https://s3.<region>.amazonaws.com or a CloudFront domain.

Resources:
  # The connection string never appears in the task definition: ECS reads it
  # from Secrets Manager at launch and injects it as DATABASE_URL.
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: viajajunto/database-url
      Description: PostgreSQL connection string used by the API.
      SecretString: !Sub 'postgresql://${DbUser}:${DbPassword}@${DbHost}:${DbPort}/${DbName}?schema=public'

  # Application credentials, one JSON document; each key is injected as its
  # own environment variable through the `<arn>:<key>::` valueFrom syntax.
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: viajajunto/app
      Description: OAuth client and JWT signing key used by the API.
      SecretString: !Sub |
        {"GOOGLE_CLIENT_ID":"${GoogleClientId}","GOOGLE_CLIENT_SECRET":"${GoogleClientSecret}","JWT_SECRET":"${JwtSecret}"}

  # ── Photos ────────────────────────────────────────────────────────────
  # Destination and activity photos. Objects are public-read so the frontend
  # can use photoUrl straight in an <img>; only the API task can write.
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'viajajunto-photos-${AWS::AccountId}'
      # New AWS buckets block public policies by default; this one is meant
      # to serve public images, so the policy below must be allowed.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      # Only needed if the frontend fetch()es images or draws them on a canvas;
      # plain <img> tags work without it. (MiniStack ignores this block.)
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3600

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadPhotos
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${PhotosBucket.Arn}/*'

  # Role the API process itself assumes (the execution role above is only
  # used by ECS to start the task). The SDK picks it up automatically.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: viajajunto-api-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-photos
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${PhotosBucket.Arn}/*'

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/viajajunto-api
      RetentionInDays: 7

  # Role ECS assumes to pull the image, read the secret and ship logs.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: viajajunto-ecs-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseUrlSecret
                  - !Ref AppSecrets

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: viajajunto

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: viajajunto-api
      # EC2 launch type with bridge networking: the container port is
      # published on the host, which is how it becomes reachable locally.
      # Fargate requires awsvpc, which publishes no host port.
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref Image
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              HostPort: !Ref HostPort
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '3000'
            - Name: API_PREFIX
              Value: api
            - Name: GOOGLE_CALLBACK_URL
              Value: !Sub 'http://localhost:${HostPort}/api/auth/google/callback'
            - Name: AUTH_REDIRECT_URL
              Value: !Ref AuthRedirectUrl
            - Name: JWT_EXPIRES_IN
              Value: '3600'
            # S3 endpoint and credentials are not set here: ECS (and
            # MiniStack) provide them to the task, and the SDK reads them
            # from AWS_ENDPOINT_URL / the container credentials endpoint.
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref PhotosBucket
            - Name: S3_PUBLIC_URL
              Value: !Sub '${PublicStorageUrl}/${PhotosBucket}'
            # MiniStack is reached by IP, where bucket subdomains cannot
            # resolve. Unnecessary (but harmless) on real AWS.
            - Name: S3_FORCE_PATH_STYLE
              Value: 'true'
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecret
            - Name: GOOGLE_CLIENT_ID
              ValueFrom: !Sub '${AppSecrets}:GOOGLE_CLIENT_ID::'
            - Name: GOOGLE_CLIENT_SECRET
              ValueFrom: !Sub '${AppSecrets}:GOOGLE_CLIENT_SECRET::'
            - Name: JWT_SECRET
              ValueFrom: !Sub '${AppSecrets}:JWT_SECRET::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: viajajunto-api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: EC2
      DesiredCount: 1
      # One task bound to a fixed host port: a new task cannot start while the
      # old one holds the port. Stop first, then start — a short gap instead
      # of a deployment that never completes.
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  DatabaseUrlSecretArn:
    Value: !Ref DatabaseUrlSecret
  ApiUrl:
    Value: !Sub 'http://localhost:${HostPort}/api'
  PhotosBucketName:
    Value: !Ref PhotosBucket
  PhotosPublicUrl:
    Value: !Sub '${PublicStorageUrl}/${PhotosBucket}'
